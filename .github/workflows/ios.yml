name: iOS IPA derle
on:
  workflow_dispatch:
  push:
    paths:
      - 'DepremKalkaniIOS/**'
      - '.github/workflows/ios.yml'
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen kur
        run: brew install xcodegen
      - name: Xcode projesini olustur
        working-directory: DepremKalkaniIOS
        run: xcodegen generate
      - name: Derle (imzasiz)
        working-directory: DepremKalkaniIOS
        run: |
          set +e
          xcodebuild -project DepremKalkani.xcodeproj -scheme DepremKalkani \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > ../xcodebuild.log 2>&1
          status=$?
          echo "=========== HATA OZETI ==========="
          grep -nE "error:" ../xcodebuild.log | sort -u | head -40
          echo "=========== BITTI (cikis kodu: $status) ==========="
          exit $status
      - name: IPA paketle
        working-directory: DepremKalkaniIOS
        run: |
          APP=$(find build/Build/Products -name "DepremKalkani.app" -maxdepth 3 | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr DepremKalkani.ipa Payload
          ls -l DepremKalkani.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DepremKalkani-IPA
          path: DepremKalkaniIOS/DepremKalkani.ipa
