name: DepremKalkani
options:
  bundleIdPrefix: app.depremkalkani
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  DepremKalkani:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Deprem Kalkanı
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, audio]
        BGTaskSchedulerPermittedIdentifiers: [app.depremkalkani.refresh]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSExceptionDomains:
            koeri.boun.edu.tr:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.depremkalkani
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
